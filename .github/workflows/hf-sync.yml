name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push Backend to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          cd backend

          # حذف الملفات الثنائية الكبيرة قبل الرفع
          find . -type f \( \
            -name "*.pt" -o \
            -name "*.pth" -o \
            -name "*.onnx" -o \
            -name "*.task" -o \
            -name "*.pkl" -o \
            -name "*.h5" -o \
            -name "*.npy" -o \
            -name "*.npz" -o \
            -name "*.png" -o \
            -name "*.jpg" -o \
            -name "*.jpeg" -o \
            -name "*.gif" -o \
            -name "*.mp4" -o \
            -name "*.mp3" -o \
            -name "*.wav" -o \
            -name "*.pdf" -o \
            -name "*.docx" -o \
            -name "*.csv" \
          \) -delete

          # حذف مجلدات غير ضرورية
          rm -rf __pycache__ .pytest_cache session_logs/ data/*.csv

          # تهيئة git جديد
          git init
          git checkout -b main
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # إضافة الكود فقط
          git add .
          git commit -m "Auto-sync from GitHub [$(date +'%Y-%m-%d %H:%M')]"

          # رفع لـ Hugging Face Space
          git push -f https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID} main
